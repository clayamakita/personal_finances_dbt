name: "personal_finances"
version: "1.0.0"
config-version: 2

profile: "default"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  personal_finances:
    +persist_docs:
      relation: true
      columns: true

    staging:
      +materialized: view

    intermediate:
      +materialized: view

    marts:
      +materialized: table

on-run-start:
  - "{{ calculate_annualized_return() }}"

vars:
  project_timezone: "America/Toronto"
