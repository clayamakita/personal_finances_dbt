version: 2

models:
  - name: dim_accounts 
    description: List of financial accounts with beginning/current balances, type, and category.
    columns:
      - name: account_id 
        description: Unique identifier for the account. 
        data_tests:
          - unique
          - not_null

      - name: account_name 
        description: Account name, often including the type of account (e.g. Chequing, Credit Card, Savings) and the account holder (e.g. Chequing Kenji, Savings Family).
        data_tests:
          - unique
          - not_null

      - name: account_type 
        description: High-level classification of the account — Assets or Liabilities.
        data_tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['Assets', 'Liabilities']

      - name: account_category 
        description: Functional grouping of the account (e.g. Chequing, Savings, Credit Card) used for reporting.
        data_tests:
          - not_null
          - accepted_values:
              arguments: 
                values: ['Chequing', 'Credit Card', 'Savings', 'Investments']

      - name: beginning_balance 
        description: Balance recorded when the account was first added to the file.
        data_tests:
          - not_null

      - name: current_balance 
        description: Most recent known balance for the account. Based on Beginning Balance and all Transactions records.
        data_tests:
          - not_null

  - name: dim_cashflow_categories 
    description: Dimension table of cashflow categories (e.g., Groceries, Housing, Paycheck), each associated with its parent cashflow type. Used to classify transactions at the category level and to join transaction data to budget data.
    columns:
      - name: cashflow_category_id
        description: Unique identifier for the cashflow category. 
        data_tests:
          - unique
          - not_null

      - name: cashflow_category
        description: Specific spending or income category within the type (e.g., Groceries, Housing, Paycheck, Deposit, Withdrawal).
        data_tests:
          - not_null

      - name: cashflow_type
        description: High-level cashflow category grouping (e.g., Fixed Costs, Income, Savings, Investments, Transfer, or Guilt-Free allowance).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Fixed Costs', 'Guilt-Free Family', 'Guilt-Free Kenji', 'Guilt-Free Mei', 'Guilt-Free Pet', 'Income', 'Investments', 'Savings', 'Savings Spending', 'Transfer']

  - name: dim_cashflow_types 
    description: Dimension table of high-level cashflow types (e.g., Fixed Costs, Income, Savings, Investments, Transfer, or Guilt-Free allowances). Used to classify transactions at the type level and to join transaction data to budget data.
    columns:
      - name: cashflow_type_id 
        description: Unique identifier for the cashflow type. 
        data_tests:
          - unique
          - not_null

      - name: cashflow_type 
        description: High-level cashflow category grouping (e.g., Fixed Costs, Income, Savings, Investments, Transfer, or Guilt-Free allowance).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Fixed Costs', 'Guilt-Free Family', 'Guilt-Free Kenji', 'Guilt-Free Mei', 'Guilt-Free Pet', 'Income', 'Investments', 'Savings', 'Savings Spending', 'Transfer']

  - name: dim_dates 
    description: Date dimension providing one row per calendar day, used to support time-based analysis and joins across budget, cashflow, and investments data. The range spans from the start of the year containing the earliest date across all source models (budget, cashflow transactions, and investment transactions) through the end of the year containing the latest cashflow transaction date.
    columns:
      - name: date_id
        description: Unique identifier for the date.
        data_tests:
          - unique
          - not_null

      - name: calendar_date
        description: The calendar date for this row, as a native date value.
        data_tests:
          - unique
          - not_null

      - name: calendar_year
        description: Calendar year of the date (e.g., 2026).
        data_tests:
          - not_null

      - name: calendar_quarter
        description: Calendar quarter of the date, numbered 1 through 4.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4]
                quote: false

      - name: month_number
        description: Month of the date, numbered 1 (January) through 12 (December).
        data_tests:
          - not_null

      - name: month_name
        description: Full name of the month (e.g., 'January').
        data_tests:
          - not_null

      - name: day_number
        description: Day of the month, numbered 1 through 31.
        data_tests:
          - not_null

      - name: day_of_week_name
        description: Full name of the day of the week (e.g., 'Monday').
        data_tests:
          - not_null

  - name: dim_investments
    description: Dimension table listing the current position for each investment held, including quantity, latest price, current value, and an estimated annualized rate of return (XIRR). One row per ticker.
    columns:
      - name: ticker
        description: Ticker symbol of the investment (e.g., XEQT, VFV, RY).
        data_tests:
          - unique
          - not_null

      - name: investment_name
        description: Full descriptive name of the investment associated with the ticker (e.g., iShares Core Equity ETF Portfolio, Royal Bank of Canada).
        data_tests:
          - not_null

      - name: total_quantity
        description: Total quantity (shares/units) currently held for the investment.
        data_tests:
          - not_null

      - name: latest_price
        description: Most recent known price per share/unit for the investment.
        data_tests:
          - not_null

      - name: current_value
        description: Current market value of the position, total_quantity multiplied by latest_price.
        data_tests:
          - not_null

      - name: annualized_return_rate
        description: Annualized rate of return for the investment, calculated using XIRR (extended internal rate of return) over the investment's full transaction history plus its current value as a final cash flow dated today. Rounded to 4 decimal places (e.g., 0.1507 = 15.07%).

  - name: dim_savings_goals
    description: Dimension table tracking savings goals, how much of each is currently funded, and a projected month by which each goal will be fully funded. Goals are funded in priority order (lowest goal_priority number first) - existing goals are funded first from each goal's associated account's current balance (waterfall by priority within account), and any goals not yet fully funded are then projected forward using the current month's total Savings budget, allocated across all outstanding goals in priority order. One row per goal.
    columns:
      - name: goal_name
        description: Name of the savings goal (e.g., Laptop, Vacation 2027). Unique identifier of the table.
        data_tests:
          - unique
          - not_null

      - name: goal_priority
        description: Priority rank of the goal, used to determine funding order (lower numbers are funded first). Goals already achieved have no priority. Goals without a priority set are excluded from this model.
        data_tests:
          - not_null

      - name: goal_amount
        description: Total target amount for the goal.
        data_tests:
          - not_null

      - name: running_goal_amount
        description: Cumulative sum of goal_amount for this goal and all higher-priority goals sharing the same account, ordered by goal_priority.
        data_tests:
          - not_null

      - name: account_name
        description: Name of the account the goal's savings are allocated from.
        data_tests:
          - not_null

      - name: account_current_balance
        description: Current balance of the associated account, as of the latest data.
        data_tests:
          - not_null

      - name: goal_amount_saved
        description: Amount of the goal currently funded, based on the account's current balance applied to goals in priority order (higher-priority goals in the same account are funded first). Capped between 0 and goal_amount.
        data_tests:
          - not_null

      - name: goal_status
        description: Current funding status of the goal, based on goal_amount_saved relative to goal_amount.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Achieved', 'In Progress', 'Not Started']

      - name: goal_status_id
        description: Numeric grouping used to sequence goals for funding projections — 1 for Achieved goals, 2 for all others (In Progress or Not Started).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2]
                quote: false

      - name: goal_amount_needed
        description: Remaining amount needed to fully fund the goal (goal_amount minus goal_amount_saved). 0 if the goal is already Achieved.
        data_tests:
          - not_null

      - name: running_goal_amount_needed
        description: Cumulative sum of goal_amount_needed across all goals (regardless of account), ordered by goal_status_id then goal_priority. Represents the total additional savings required to fund this goal and every goal ahead of it in the funding queue.
        data_tests:
          - not_null

      - name: budget_savings_amount
        description: Total budgeted Savings amount for the current month, taken from the latest available budget. 0 if the goal is already Achieved.
        data_tests:
          - not_null

      - name: months_to_goal
        description: Projected number of months, from the current month, until this goal is fully funded, assuming the full monthly Savings budget is applied to goals in priority order. Includes a 1-month buffer added to the calculated figure to account for the current partial month. 0 if the goal is already Achieved.
        data_tests:
          - not_null

      - name: funding_month
        description: Calendar month (first day of month) in which the goal is projected to be fully funded, based on months_to_goal. Null if the goal is already Achieved.

  - name: fct_budget
    description: Fact table of budgeted amounts by budget type and calendar month. This is the stable, single point of reference for all downstream consumers. Each row represents the budgeted amount for one budget type in one calendar month.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - budget_type
              - budget_month
    columns:
      - name: budget_month_id
        description: Surrogate key formed by concatenating a slugified `budget_type` (lowercased, with spaces and hyphens removed) with the `budget_month` date, e.g. `guiltfreepet_2026-01-01`. Uniquely identifies a budget_type/budget_month combination.
        data_tests:
          - unique
          - not_null

      - name: budget_type
        description: The budget category, e.g. Savings, Investments, Fixed Costs, Income, or one of the individual Guilt-Free categories.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Income', 'Fixed Costs', 'Investments', 'Savings', 'Guilt-Free Family', 'Guilt-Free Kenji', 'Guilt-Free Mei', 'Guilt-Free Pet']

      - name: budget_month
        description: The first day of the budgeted calendar month.
        data_tests:
          - not_null

      - name: budget_amount
        description: The budgeted dollar amount for this budget_type in this budget_month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: fct_budget_vs_actual
    description: Fact table comparing budgeted amounts to actual spending/income by budget type and calendar month. Variance Amount is signed so that positive always means "on track" or "ahead" and negative means "over" or "behind".
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - budget_type
              - budget_month
    columns:
      - name: budget_month_id
        description: Surrogate key formed by concatenating a slugified `budget_type` (lowercased, with spaces and hyphens removed) with the `budget_month` date, e.g. `guiltfreepet_2026-01-01`. Uniquely identifies a budget_type/budget_month combination.
        data_tests:
          - unique
          - not_null

      - name: budget_type
        description: The budget category, e.g. Savings, Investments, Fixed Costs, Income, or one of the individual Guilt-Free categories.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Income', 'Fixed Costs', 'Investments', 'Savings', 'Guilt-Free Family', 'Guilt-Free Kenji', 'Guilt-Free Mei', 'Guilt-Free Pet']

      - name: budget_month
        description: The first day of the budgeted calendar month.
        data_tests:
          - not_null

      - name: budget_amount
        description: The budgeted dollar amount for this budget_type in this budget_month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: actual_amount
        description: The actual dollar amount transacted for this budget_type in this budget_month, taken as the absolute value of the summed transaction total. Defaults to 0 when no matching transactions exist for that type/month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: variance_amount
        description: How far actual_amount is from budget_amount, signed so that positive is favorable and negative is unfavorable. For Income, Investments, and Savings, calculated as actual_amount minus budget_amount. For all other categories, calculated as budget_amount minus actual_amount.
        data_tests:
          - not_null

  - name: fct_budget_vs_actual_guilt_free
    description: Fact table comparing budgeted amounts to actual spending for Guilt-Free categories only, with running (cumulative, year-to-date) totals alongside the monthly figures. 
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - budget_type
              - budget_month
    columns:
      - name: budget_month_id
        description: Surrogate key formed by concatenating a slugified `budget_type` (lowercased, with spaces and hyphens removed) with the `budget_month` date, e.g. `guiltfreepet_2026-01-01`. Uniquely identifies a budget_type/budget_month combination.
        data_tests:
          - unique
          - not_null

      - name: budget_type
        description: The Guilt-Free budget type.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Guilt-Free Family', 'Guilt-Free Kenji', 'Guilt-Free Mei', 'Guilt-Free Pet']

      - name: budget_month
        description: The first day of the budgeted calendar month.
        data_tests:
          - not_null

      - name: budget_amount
        description: The budgeted dollar amount for this budget_type in this budget_month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: actual_amount
        description: The actual dollar amount transacted for this budget_type in this budget_month, taken as the absolute value of the summed transaction total. Defaults to 0 when no matching transactions exist for that category/month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: running_budget_amount
        description: Cumulative sum of budget_amount for this budget_type, from the start of the data through this budget_month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: running_actual_amount
        description: Cumulative sum of actual_amount for this budget_type, from the start of the data through this budget_month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: running_variance_amount
        description: How far cumulative actual spending is from cumulative budget, calculated as running_budget_amount minus running_actual_amount. Positive means under budget; negative means over budget.
        data_tests:
          - not_null

  - name: fct_budget_fixed_costs
    description: Fact table of budgeted amounts by fixed costs category and calendar month. This is the stable, single point of reference for all downstream consumers. Each row represents the budgeted amount for one fixed costs category in one calendar month.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - budget_category
              - budget_month
    columns:
      - name: budget_fixed_costs_month_id
        description: Surrogate key formed by concatenating a slugified `budget_category` (lowercased, spaces removed) with the `budget_month` date, e.g. `housing_2026-01-01`. Uniquely identifies a budget_category/budget_month combination.
        data_tests:
          - unique
          - not_null

      - name: budget_category
        description: High-level spending fixed costs category (e.g. Housing, Groceries, Transportation, Pet, Healthcare, Miscellaneous).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Groceries', 'Healthcare', 'Housing', 'Household Items', 'Miscellaneous', 'Pet', 'Transportation']

      - name: budget_month
        description: The first day of the budgeted calendar month.
        data_tests:
          - not_null

      - name: budget_amount
        description: The budgeted dollar amount for this budget_category in this budget_month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

  - name: fct_budget_vs_actual_fixed_costs
    description: Fact table comparing budgeted amounts to actual spending for fixed costs categories by calendar month. Variance Amount is signed so that positive always means "on track" and negative means "over".
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - budget_category
              - budget_month
    columns:
      - name: budget_fixed_costs_month_id
        description: Surrogate key formed by concatenating a slugified `budget_category` (lowercased, spaces removed) with the `budget_month` date, e.g. `housing_2026-01-01`. Uniquely identifies a budget_category/budget_month combination.
        data_tests:
          - unique
          - not_null

      - name: budget_category
        description: High-level spending fixed costs category (e.g. Housing, Groceries, Transportation, Pet, Healthcare, Miscellaneous).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Groceries', 'Healthcare', 'Housing', 'Household Items', 'Miscellaneous', 'Pet', 'Transportation']

      - name: budget_month
        description: The first day of the budgeted calendar month.
        data_tests:
          - not_null

      - name: budget_amount
        description: The budgeted dollar amount for this budget_category in this budget_month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: actual_amount
        description: The actual dollar amount transacted for this budget_category in this budget_month, taken as the absolute value of the summed transaction total among Fixed Costs transactions. Defaults to 0 when no matching transactions exist for that category/month.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: variance_amount
        description: How far actual_amount is from budget_amount, calculated as budget_amount minus actual_amount. Positive means spending less than budgeted (favorable); negative means over budget.
        data_tests:
          - not_null

  - name: fct_cashflow_transactions
    description: Fact table of all individual account transactions (income, expenses, transfers). This is the stable, single point of reference for all downstream consumers. Each row represents one transaction.
    columns:
      - name: transaction_id
        description: Unique identifier for the transaction, manually assigned in Google Sheets.
        data_tests:
          - unique
          - not_null

      - name: account_name
        description: Account the transaction occurred in (e.g., Chequing Joint Account, Credit Card Kenji).
        data_tests:
          - not_null

      - name: transaction_type
        description: High-level cashflow category grouping (e.g., Fixed Costs, Income, Savings, Investments, Transfer, or an individual Guilt-Free allowance).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Fixed Costs', 'Income', 'Savings', 'Investments', 'Transfer', 'Guilt-Free Family', 'Guilt-Free Kenji', 'Guilt-Free Mei', 'Guilt-Free Pet']

      - name: transaction_category
        description: Specific spending or income category within the type (e.g., Groceries, Housing, Paycheck, Deposit, Withdrawal).
        data_tests:
          - not_null

      - name: transaction_location
        description: Merchant, vendor, or source/destination of the transaction.

      - name: transaction_item
        description: Short label for what the transaction was for (e.g., Rent, Paycheck, Apples).
        data_tests:
          - not_null

      - name: transaction_amount
        description: Transaction value. Negative for money out (expenses, transfers out), positive for money in (income, deposits).
        data_tests:
          - not_null

      - name: quantity
        description: Quantity of units purchased, where applicable (e.g., weight or count of a grocery item). Null when not tracked at the item level.
        data_tests:
          - dbt_utils.expression_is_true:
              arguments:
                expression: "is null or quantity > 0"

      - name: unit
        description: Unit of measure for quantity (e.g., kg, unit, can, loaf). Null when quantity isn't tracked.

      - name: transaction_date
        description: Date the transaction occurred.
        data_tests:
          - not_null

      - name: notes
        description: Free-text notes about the transaction.

  - name: fct_investments_transactions
    description: Fact table of all investment account transactions (buys, sells, dividends). This is the stable, single point of reference for all downstream consumers. Each row represents one investment transaction.
    columns:
      - name: investment_transaction_id
        description: Unique identifier for the investment transaction.
        data_tests:
          - unique
          - not_null

      - name: account_name
        description: Investment account the transaction belongs to (e.g., TFSA Kenji, TFSA Mei).
        data_tests:
          - not_null

      - name: investment_type
        description: Broad classification of the investment involved in the transaction (e.g., ETF, Stock).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Bond', 'ETF', 'GIC', 'Index Fund', 'Mutual Fund', 'Stock']

      - name: investment_event
        description: Type of transaction event (e.g., Buy, Sell, Dividend).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Buy', 'Dividends', 'Sell']

      - name: ticker
        description: Ticker symbol of the investment involved in the transaction (e.g., XEQT, VFV, RY).
        data_tests:
          - not_null

      - name: investment_name
        description: Full name of the investment involved in the transaction (e.g., iShares Core Equity ETF Portfolio, Royal Bank of Canada).
        data_tests:
          - not_null

      - name: quantity
        description: Number of units transacted.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: price
        description: Price per unit at the time of the transaction.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> 0"

      - name: total_value
        description: Total cash value of the transaction (negative for purchases and positive for sells).
        data_tests:
          - not_null

      - name: dividends
        description: Dividend amount associated with the transaction. Defaults to 0 when not applicable.
        data_tests:
          - not_null

      - name: net_quantity
        description: Quantity held as a result of this transaction — positive for buys, negative for sells. Adding this up across all transactions for a ticker gives the current amount held.
        data_tests:
          - not_null

      - name: event_date
        description: Date the transaction occurred.
        data_tests:
          - not_null

  - name: fct_monthly_paycheck_allocation
    description: Fact table checking that paycheck income is being fully allocated each month across its intended destinations — Fixed Costs, Savings, Investments, and Guilt-Free spending — with room to catch unexpected income (e.g. a bonus or an extra paycheck) that hasn't yet been assigned a destination. Guilt-Free actuals are overridden to always equal the Guilt-Free budget_amount — by design, since guilt-free spending is meant to be auto-allocated at the budgeted amount each month (any underspend carries over rather than counting as a shortfall here). Each row represents one allocation_type in one calendar month.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - allocation_type
              - budget_month

    columns:
      - name: allocation_type
        description: The high-level bucket paycheck income is being checked against — Paycheck (budgeted Income), Fixed Costs, Savings, Investments, or Guilt-Free (all Guilt-Free categories combined).
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['Paycheck', 'Fixed Costs', 'Savings', 'Investments', 'Guilt-Free']

      - name: budget_month
        description: The first day of the budgeted calendar month.
        data_tests:
          - not_null

      - name: budget_amount
        description: The total budgeted dollar amount for this allocation_type in this budget_month (e.g. all four Guilt-Free categories combined for the 'Guilt-Free' allocation_type).
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: allocation_amount
        description: The actual dollar amount allocated to this allocation_type in this budget_month, taken as the absolute value of the summed transaction total. For the Guilt-Free allocation_type, this is not the actual transaction total — it's hardcoded to equal budget_amount, since guilt-free spending is treated as automatically allocated in full each month regardless of what was actually spent. Defaults to 0 when no matching transactions exist for a non-Guilt-Free type.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: allocation_variance
        description: How far allocation_amount is from budget_amount, signed so that positive always flags something worth checking. For Paycheck, Investments, and Savings, calculated as allocation_amount minus budget_amount — positive means more came in or was allocated than budgeted (e.g. a bonus, extra paycheck, or surplus investment/savings contribution not yet accounted for elsewhere). For Fixed Costs and Guilt-Free, calculated as budget_amount minus allocation_amount — positive means under budget. Because Guilt-Free's allocation_amount is always forced to equal its budget_amount, this column is always 0 for the Guilt-Free allocation_type by construction.
        data_tests:
          - not_null

  - name: retirement_projection
    description: Single-row model projecting the future value of investment holdings at retirement, using compound interest. Combines current total investment market value, personal assumptions, and the current monthly Investments budget amount  to project using a monthly-compounding future value formula with regular contributions.
    columns:
      - name: current_value
        description: Total current market value of all investment holdings as of the latest available price, summed across all tickers.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: current_age
        description: Current age used as the starting point for the projection.
        data_tests:
          - not_null

      - name: retirement_age
        description: Age at which retirement is planned to begin.
        data_tests:
          - not_null
          - dbt_utils.expression_is_true:
              arguments:
                expression: "> current_age"

      - name: projected_interest_rate
        description: Assumed annual rate of return used to project investment growth (e.g., 0.07 = 7%).
        data_tests:
          - not_null

      - name: monthly_contribution
        description: Assumed ongoing monthly contribution toward investments, taken as the budgeted Investments amount for the latest calendar month with transaction activity.
        data_tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                inclusive: true

      - name: future_value
        description: Projected total investment value at retirement, calculated by compounding current_value monthly at projected_interest_rate/12 over (retirement_age - current_age) years, plus the future value of monthly_contribution made over the same period at the same rate.
        data_tests:
          - not_null