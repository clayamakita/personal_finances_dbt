version: 2

sources:
  - name: google_sheets
    description: Raw data replicated from Google Sheets file. Synced via Fivetran.
    database: personal-finances-501019
    schema: src_google_sheets
    tables:
      - name: accounts
        description: List of financial accounts with beginning/current balances, type, and category.
        columns:
          - name: _row
            description: Row number from Google Sheets. Generated by Fivetran.
            data_tests:
              - unique
              - not_null

          - name: _fivetran_synced
            description: Timestamp when Fivetran last successfully synced that specific row.

          - name: account_id 
            description: Unique identifier for the account. Added manually in Google Sheets.
            data_tests:
              - unique
              - not_null
            
          - name: account
            description: Account name, often including the type of account (e.g. Chequing, Credit Card, Savings) and the account holder (e.g. Chequing Kenji, Savings Family).
            data_tests:
              - unique
              - not_null

          - name: beginning_balance 
            description: Balance recorded when the account was first added to the file.
            data_tests:
              - not_null

          - name: current_balance 
            description: Most recent known balance for the account. Calculated on the file, based on Beginning Balance and Transactions data.

          - name: account_type 
            description: High-level classification of the account — Assets or Liabilities.
            data_tests:
              - not_null
              - accepted_values:
                  arguments: 
                    values: ['Assets', 'Liabilities']

          - name: account_category 
            description: Functional grouping of the account (e.g. Chequing, Savings, Credit Card) used for reporting.
            data_tests:
              - not_null
              - accepted_values:
                  arguments: 
                    values: ['Chequing', 'Credit Card', 'Savings', 'Investments']

              
      - name: budget_2026
        description: Source table containing monthly budget. Each row represents a budget type and shows the budgeted amount for that type across all twelve months (January 2026 - December 2026).
        columns:
          - name: _row
            description: Row number from Google Sheets. Generated by Fivetran.
            data_tests:
            - unique
            - not_null

          - name: _fivetran_synced 
            description: Timestamp when Fivetran last successfully synced that specific row.
            data_tests:
              - not_null

          - name: type 
            description: Label identifying the top-level buckets (e.g. "Income," "Fixed Costs," "Savings, "Investments"), individual discretionary "Guilt-Free" allowances per person or purpose (e.g. "Guilt-Free Mei," "Guilt-Free Kenji", "Guilt-Free Family," "Guilt-Free Pet") and a subtotal row ("Guilt-Free Total").
            data_tests:
            - unique
            - not_null
            - accepted_values:
                arguments: 
                  values: ['Income', 'Fixed Costs', 'Investments', 'Savings', 'Guilt-Free Total', 'Guilt-Free Family', 'Guilt-Free Kenji', 'Guilt-Free Mei', 'Guilt-Free Pet']

          - name: january_2026 
            description: Budgeted amount for this type in January 2026.
            data_tests:
              - not_null

          - name: february_2026 
            description: Budgeted amount for this type in February 2026.
            data_tests:
              - not_null
              
          - name: march_2026 
            description: Budgeted amount for this type in March 2026.
            data_tests:
              - not_null

          - name: april_2026 
            description: Budgeted amount for this type in April 2026.
            data_tests:
              - not_null

          - name: may_2026 
            description: Budgeted amount for this type in May 2026.
            data_tests:
              - not_null

          - name: june_2026 
            description: Budgeted amount for this type in June 2026.
            data_tests:
              - not_null

          - name: july_2026 
            description: Budgeted amount for this type in July 2026.
            data_tests:
              - not_null

          - name: august_2026 
            description: Budgeted amount for this type in August 2026.
            data_tests:
              - not_null

          - name: september_2026 
            description: Budgeted amount for this type in September 2026.
            data_tests:
              - not_null

          - name: october_2026 
            description: Budgeted amount for this type in October 2026.
            data_tests:
              - not_null

          - name: november_2026 
            description: Budgeted amount for this type in November 2026.
            data_tests:
              - not_null

          - name: december_2026 
            description: Budgeted amount for this type in December 2026.
            data_tests:
              - not_null

      - name: budget_2026_fixed_costs
        description: Source table containing the breakdown of fixed costs for the monthly budget. Each row represents a single budget line item, grouped by Fixed Costs category, and shows the budgeted amount for that item across all twelve months (January 2026 - December 2026).
        columns:
          - name: _row 
            description: Row number from Google Sheets. Generated by Fivetran.
            data_tests:
              - unique
              - not_null

          - name: _fivetran_synced 
            description: Timestamp when Fivetran last successfully synced that specific row.
            data_tests:
              - not_null

          - name: category 
            description: High-level spending Fixed Costs category the line item belongs to (e.g. Housing, Groceries, Transportation, Pet, Healthcare, Miscellaneous).
            data_tests:
              - not_null
              - accepted_values:
                  arguments: 
                    values: ['Groceries', 'Healthcare', 'Housing', 'Household Items', 'Miscellaneous', 'Pet', 'Transportation']

          - name: item 
            description: Descriptive name of the individual budget line item (e.g. "Rent", "Electricity", "Cellphone plan") or a category subtotal row (e.g. "Groceries Total") where item-level detail isn't broken out.
            data_tests:
              - not_null

          - name: january_2026 
            description: Budgeted amount for this line item in January 2026.
            data_tests:
              - not_null

          - name: february_2026 
            description: Budgeted amount for this line item in February 2026.
            data_tests:
              - not_null

          - name: march_2026 
            description: Budgeted amount for this line item in March 2026.
            data_tests:
              - not_null

          - name: april_2026 
            description: Budgeted amount for this line item in April 2026.
            data_tests:
              - not_null

          - name: may_2026 
            description: Budgeted amount for this line item in May 2026.
            data_tests:
              - not_null

          - name: june_2026 
            description: Budgeted amount for this line item in June 2026.
            data_tests:
              - not_null

          - name: july_2026 
            description: Budgeted amount for this line item in July 2026.
            data_tests:
              - not_null

          - name: august_2026 
            description: Budgeted amount for this line item in August 2026.
            data_tests:
              - not_null            

          - name: september_2026 
            description: Budgeted amount for this line item in September 2026.
            data_tests:
              - not_null

          - name: october_2026 
            description: Budgeted amount for this line item in October 2026.
            data_tests:
              - not_null

          - name: november_2026 
            description: Budgeted amount for this line item in November 2026.
            data_tests:
              - not_null

          - name: december_2026 
            description: Budgeted amount for this line item in December 2026.
            data_tests:
              - not_null

      - name: investments_price 
        description: Latest investment pricing data from the Toronto Stock Exchange (TSE), sourced using the GOOGLEFINANCE function on Google Sheets.
        columns:
          - name: _row 
            description: Row number from Google Sheets. Generated by Fivetran.
            data_tests:
              - unique
              - not_null

          - name: _fivetran_synced 
            description: Timestamp when Fivetran last successfully synced that specific row.
            data_tests:
              - not_null

          - name: investment_price_id 
            description: Unique identifier for the price record. Added manually in Google Sheets.
            data_tests:
              - unique
              - not_null

          - name: ticker 
            description: Ticker symbol of the investment (e.g., VFV, XEQT).
            data_tests:
              - unique
              - not_null

          - name: investment_name 
            description: Full name of the investment fund or stock. 
            data_tests:
              - unique
              - not_null

          - name: live_price 
            description: Most recent traded price in the Toronto Exchange Stock (TSE), delayed per the feed's time delay.
            data_tests:
              - not_null

          - name: last_trade_time 
            description: Timestamp of the last recorded trade in the Toronto Exchange Stock (TSE).
            data_tests:
              - not_null

          - name: time_delay 
            description: Delay in minutes between the actual trade and the reported price in the Toronto Exchange Stock (TSE).


      - name: investments_transactions
        description: Historical log of investment transactions (buys, sells, dividends) across accounts,
        columns:
          - name: _row 
            description: Row number from Google Sheets. Generated by Fivetran.
            data_tests:
              - unique
              - not_null

          - name: _fivetran_synced 
            description: Timestamp when Fivetran last successfully synced that specific row.
            data_tests:
              - not_null

          - name: account
            description: Investment account the transaction belongs to (e.g., TFSA Kenji, TFSA Mei).
            data_tests:
              - not_null

          - name: type
            description: Asset type of the investment (e.g., ETF, Stock).
            data_tests:
              - not_null
              - accepted_values:
                  arguments: 
                    values: ['Bond', 'ETF', 'GIC', 'Index Fund', 'Mutual Fund', 'Stock']

          - name: investment_name
            description: Full name of the investment fund or stock.
            data_tests:
              - not_null

          - name: ticker
            description: Ticker symbol of the investment.
            data_tests:
              - not_null

          - name: event
            description: Type of transaction event (e.g., Buy, Sell).
            data_tests:
              - not_null
              - accepted_values:
                  arguments: 
                    values: ['Buy', 'Dividends', 'Sell']

          - name: qty
            description: Quantity of units transacted.
            data_tests:
              - not_null

          - name: net_qty
            description: Quantity held as a result of this transaction — positive for buys, negative for sells. Adding this up across all transactions for a ticker gives the current amount held.
            data_tests:
              - not_null

          - name: price
            description: Price per unit at the time of the transaction.
            data_tests:
              - not_null

          - name: total_value
            description: Total cash value of the transaction (negative for purchases and positive for sells).
            data_tests:
              - not_null

          - name: date
            description: Date the transaction occurred.
            data_tests:
              - not_null

          - name: dividends
            description: Dividend amount received, if applicable.

              
      - name: savings_goals
        columns:
          - name: _row
            data_tests:
              - unique
              - not_null
              
      - name: savings_goals_details
        columns:
          - name: _row
            data_tests:
              - unique
              - not_null
              
      - name: cashflow_transactions
        columns:
          - name: _row
            data_tests:
              - unique
              - not_null
              
      - name: cashflow_type_category
        columns:
          - name: _row
            data_tests:
              - unique
              - not_null

      - name: retirement_assumptions
        columns:
          - name: _row
            data_tests:
              - unique
              - not_null