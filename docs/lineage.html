<text x="973.0" y="-1053.0" text-anchor="middle" font-family="Helvetica,Arial,sans-serif" font-size="26" fill="#5F6368">Intermediate</text>

</div>
<script>
(function () {
  const graph = document.getElementById('graph');
  const svg = graph.querySelector('svg');
  const info = document.getElementById('info');
  const nodes = new Map();               // id -> {el, label, parents:[], children:[]}
  const edges = [];                      // {el, from, to}

  svg.querySelectorAll('g.node').forEach(el => {
    const id = el.querySelector('title').textContent;
    nodes.set(id, { el, label: el.querySelector('text').textContent, parents: [], children: [] });
  });
  svg.querySelectorAll('g.edge').forEach(el => {
    const [from, to] = el.querySelector('title').textContent.split('->');
    if (!nodes.has(from) || !nodes.has(to)) return;
    edges.push({ el, from, to });
    nodes.get(from).children.push(to);
    nodes.get(to).parents.push(from);
  });

  function walk(start, key) {
    const seen = new Set(), stack = [start];
    while (stack.length) for (const n of nodes.get(stack.pop())[key]) if (!seen.has(n)) { seen.add(n); stack.push(n); }
    return seen;
  }

  let selected = null;

  function paint(id) {
    if (!id) {
      nodes.forEach(n => n.el.classList.remove('faded', 'selected'));
      edges.forEach(e => e.el.classList.remove('faded', 'on'));
      return;
    }
    const up = walk(id, 'parents'), down = walk(id, 'children');
    nodes.forEach((n, nid) => {
      n.el.classList.toggle('faded', !(nid === id || up.has(nid) || down.has(nid)));
      n.el.classList.toggle('selected', nid === id);
    });
    edges.forEach(e => {
      const on = (e.to === id || up.has(e.to)) || (e.from === id || down.has(e.from));
      e.el.classList.toggle('on', on);
      e.el.classList.toggle('faded', !on);
    });
    return { up, down };
  }

  function select(id) {
    selected = id;
    const r = paint(id);
    if (!id) { info.textContent = 'Click a model to highlight its full upstream and downstream lineage.'; return; }
    info.innerHTML = '<b>' + nodes.get(id).label + '</b> — ' + r.up.size + ' upstream, ' + r.down.size +
                     ' downstream. Click the background or press Esc to reset.';
  }

  nodes.forEach((n, id) => {
    n.el.addEventListener('click', ev => { ev.stopPropagation(); select(selected === id ? null : id); });
    n.el.addEventListener('mouseenter', () => { if (!selected) paint(id); });
    n.el.addEventListener('mouseleave', () => { if (!selected) paint(null); });
  });
  graph.addEventListener('click', () => select(null));
  document.addEventListener('keydown', ev => { if (ev.key === 'Escape') select(null); });
  document.getElementById('reset').addEventListener('click', () => select(null));

  // search
  const dl = document.getElementById('models'), search = document.getElementById('search');
  const byLabel = new Map();
  nodes.forEach((n, id) => { byLabel.set(n.label, id); const o = document.createElement('option'); o.value = n.label; dl.appendChild(o); });
  search.addEventListener('change', () => {
    const id = byLabel.get(search.value.trim());
    if (!id) return;
    select(id);
    nodes.get(id).el.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
  });

  // zoom: the SVG is vector, so any width stays sharp
  const vb = svg.viewBox.baseVal;
  let scale = 1;
  const fitScale = () => (graph.clientWidth - 32) / vb.width;
  function setScale(s) { scale = Math.min(Math.max(s, 0.2), 6); svg.style.width = (vb.width * scale) + 'px'; }
  document.getElementById('zin').addEventListener('click', () => setScale(scale * 1.25));
  document.getElementById('zout').addEventListener('click', () => setScale(scale / 1.25));
  document.getElementById('fit').addEventListener('click', () => setScale(fitScale()));
  graph.addEventListener('wheel', ev => {
    if (!(ev.ctrlKey || ev.metaKey)) return;
    ev.preventDefault();
    setScale(scale * (ev.deltaY < 0 ? 1.1 : 1 / 1.1));
  }, { passive: false });
  setScale(Math.min(fitScale(), 1.4));
})();
</script>
</body>
</html>
